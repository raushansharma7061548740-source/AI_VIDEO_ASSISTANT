<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Video Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="reel" aria-hidden="true"></div>

  <header class="site-header">
    <div class="mark">VA</div>
    <div class="head-text">
      <h1>Video Assistant</h1>
      <p>Drop in a recording. Get the transcript, the summary, and what to act on.</p>
    </div>
  </header>

  <main>

    <!-- INPUT SECTION -->
    <section class="panel" id="input-panel">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="url" role="tab" aria-selected="true">YouTube link</button>
        <button class="tab" data-tab="file" role="tab" aria-selected="false">Upload a file</button>
      </div>

      <div class="tab-body" id="tab-url">
        <label for="youtube-url" class="field-label">Paste a YouTube URL</label>
        <input type="url" id="youtube-url" placeholder="https://www.youtube.com/watch?v=..." />
      </div>

      <div class="tab-body hidden" id="tab-file">
        <label for="file-input" class="field-label">Choose an audio or video file</label>
        <input type="file" id="file-input" accept="audio/*,video/*" />
        <p class="file-name" id="file-name"></p>
      </div>

      <button class="primary-btn" id="process-btn">Process recording</button>

      <div class="status-line" id="status-line"></div>
    </section>

    <!-- RESULTS SECTION -->
    <section class="results hidden" id="results">

      <div class="result-block title-block">
        <span class="counter">00:00</span>
        <h2 id="result-title">—</h2>
      </div>

      <div class="result-block">
        <h3>Summary</h3>
        <p id="result-summary" class="prose"></p>
      </div>

      <div class="grid-two">
        <div class="result-block accent-rust">
          <h3>Action items</h3>
          <div id="result-actions" class="prose list-like"></div>
        </div>

        <div class="result-block accent-teal">
          <h3>Key decisions</h3>
          <div id="result-decisions" class="prose list-like"></div>
        </div>
      </div>

      <div class="result-block">
        <h3>Open questions</h3>
        <div id="result-questions" class="prose list-like"></div>
      </div>

    </section>

    <!-- CHAT SECTION -->
    <section class="chat-panel hidden" id="chat-panel">
      <h3>Ask about this recording</h3>
      <div class="chat-log" id="chat-log">
        <div class="chat-msg system">Ask anything — answers stick to what was actually said.</div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="e.g. What did we decide about the budget?" />
        <button id="chat-send" class="secondary-btn">Ask</button>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
